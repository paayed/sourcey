openapi: 3.0.0
info:
  title: Simple API overview
  version: 2.0.0
  description: Dummy API reference with an introduction plus grouped Authentication and Store endpoints.
tags:
  - name: Authentication
    description: Customer registration, login, session, and logout endpoints.
  - name: Store
    description: Browse products and place or cancel store orders.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      operationId: createCustomerAccount
      summary: Create customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "201":
          description: Customer account created
  /auth/login:
    post:
      tags:
        - Authentication
      operationId: loginCustomer
      summary: Customer login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Authenticated successfully
  /auth/profile:
    get:
      tags:
        - Authentication
      operationId: getCustomerProfile
      summary: Get customer profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer profile returned
  /auth/logout:
    post:
      tags:
        - Authentication
      operationId: logoutCustomer
      summary: Customer logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Customer logged out
  /store/items:
    get:
      tags:
        - Store
      operationId: listStoreItems
      summary: List store items
      responses:
        "200":
          description: Store items returned
  /store/items/{itemId}:
    get:
      tags:
        - Store
      operationId: getStoreItem
      summary: Get store item by ID
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Store item returned
  /store/orders:
    post:
      tags:
        - Store
      operationId: placeStoreOrder
      summary: Place store order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemId
                - quantity
              properties:
                itemId:
                  type: string
                quantity:
                  type: integer
      responses:
        "201":
          description: Order created
  /store/orders/{orderId}:
    delete:
      tags:
        - Store
      operationId: cancelStoreOrder
      summary: Cancel store order
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Order canceled

